<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live2D-Style 2D Anime Avatar — Kaiwa</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at 50% 30%, #1f2937 0%, #0f172a 100%);
  color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.stage-container {
  width: 960px;
  max-width: 95vw;
  height: 90vh;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;
  display: grid;
  grid-template-columns: 460px 1fr;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}

/* ── AVATAR STAGE (PARALLAX + LIVE2D SIMULATION) ── */
.avatar-viewport {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(56, 189, 248, 0.05) 0%, rgba(99, 102, 241, 0.05) 100%);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  perspective: 1000px;
}

/* Room Lights & Bokeh */
.light-spot {
  position: absolute;
  top: 10%;
  width: 280px; height: 280px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
  filter: blur(40px);
  pointer-events: none;
}

/* Character Skeleton Root */
.live2d-rig {
  position: relative;
  width: 320px;
  height: 480px;
  transform-style: preserve-3d;
  transition: transform 0.1s ease-out;
  transform: rotateX(var(--rot-x, 0deg)) rotateY(var(--rot-y, 0deg));
}

/* 1. Body & Breathing */
.rig-torso {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 220px;
  animation: breathingTorso 4.2s ease-in-out infinite;
}
@keyframes breathingTorso {
  0%, 100% { transform: translateX(-50%) translateY(0) scaleY(1); }
  50% { transform: translateX(-50%) translateY(-5px) scaleY(1.015); }
}

/* Clothes & Blazer */
.uniform-suit {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
  border-radius: 60px 60px 0 0;
  position: relative;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
.collar-v {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 70px; height: 90px;
  background: #f8fafc;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.ribbon-tie {
  position: absolute;
  top: 30px; left: 50%; transform: translateX(-50%);
  width: 44px; height: 35px;
  background: #f43f5e;
  border-radius: 6px;
  box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4);
}

/* 2. Neck Joint */
.rig-neck {
  position: absolute;
  top: 190px; left: 50%; transform: translateX(-50%);
  width: 38px; height: 50px;
  background: #fbcfe8;
  border-radius: 0 0 16px 16px;
  z-index: 2;
}

/* 3. Head Assembly (Rotates with 3D Mouse Parallax) */
.rig-head {
  position: absolute;
  top: 40px; left: 50%;
  transform: translateX(-50%) rotate(var(--head-tilt, 0deg));
  width: 190px; height: 210px;
  z-index: 10;
  transition: transform 0.15s ease-out;
  animation: naturalHeadSway 5s ease-in-out infinite;
}
@keyframes naturalHeadSway {
  0%, 100% { transform: translateX(-50%) rotate(0deg) translateY(0); }
  30% { transform: translateX(-50%) rotate(1.2deg) translateY(-2px); }
  70% { transform: translateX(-50%) rotate(-1deg) translateY(1px); }
}

/* Back Hair with Physics sway */
.back-hair {
  position: absolute;
  top: -10px; left: 50%; transform: translateX(-50%);
  width: 220px; height: 260px;
  background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
  border-radius: 110px 110px 40px 40px;
  z-index: 1;
  animation: backHairPhysics 3.5s ease-in-out infinite;
  transform-origin: top center;
}
@keyframes backHairPhysics {
  0%, 100% { transform: translateX(-50%) rotate(-0.8deg); }
  50% { transform: translateX(-50%) rotate(0.8deg); }
}

/* Anime Face Mesh */
.anime-face {
  position: absolute;
  top: 20px; left: 50%; transform: translateX(-50%);
  width: 156px; height: 168px;
  background: radial-gradient(circle at 50% 45%, #fff1f2 0%, #ffe4e6 100%);
  border-radius: 70px 70px 65px 65px;
  z-index: 5;
  box-shadow: inset 0 -4px 12px rgba(244, 63, 94, 0.12);
}

/* Anime Eyes (Large, Sparkling, Layered) */
.eyes-cluster {
  position: absolute;
  top: 60px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 36px;
  z-index: 8;
}
.eye-box {
  width: 36px; height: 46px;
  position: relative;
  overflow: hidden;
  border-radius: 50% 50% 40% 40%;
}

/* Upper Lash (Anime Thick Eyeliner) */
.upper-lash {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 10px;
  background: #0f172a;
  border-radius: 20px 20px 0 0;
  z-index: 10;
}
.upper-lash::after {
  content: "";
  position: absolute;
  right: -3px; top: 0px;
  width: 6px; height: 4px;
  background: #0f172a;
  transform: rotate(35deg);
}

/* Iris with Gradient & Highlights */
.iris-gem {
  position: absolute;
  inset: 6px 2px 2px 2px;
  background: radial-gradient(circle at 50% 25%, #818cf8 0%, #4338ca 60%, #1e1b4b 100%);
  border-radius: 50%;
  transform: translate(var(--eye-x, 0px), var(--eye-y, 0px));
  transition: transform 0.05s ease-out;
}
.highlight-large {
  position: absolute;
  top: 4px; left: 4px;
  width: 10px; height: 14px;
  background: #ffffff;
  border-radius: 50%;
  transform: rotate(-20deg);
}
.highlight-small {
  position: absolute;
  bottom: 8px; right: 6px;
  width: 5px; height: 5px;
  background: #a5b4fc;
  border-radius: 50%;
}

/* Eyelid Blink Mesh */
.eyelid-curtain {
  position: absolute;
  inset: 0;
  background: #ffe4e6;
  transform: translateY(-100%);
  z-index: 9;
  animation: live2dBlink 4.8s infinite;
  border-bottom: 2px solid #0f172a;
}
@keyframes live2dBlink {
  0%, 94%, 100% { transform: translateY(-100%); }
  96%, 98% { transform: translateY(0); }
}

/* Soft Blushing */
.blush-glow {
  position: absolute;
  top: 98px;
  width: 32px; height: 16px;
  background: radial-gradient(circle, rgba(244, 63, 94, 0.45) 0%, transparent 75%);
  border-radius: 50%;
  filter: blur(2px);
  z-index: 6;
}
.blush-l { left: 16px; }
.blush-r { right: 16px; }

/* Dynamic Lip-Sync Mouth */
.mouth-rig {
  position: absolute;
  bottom: 24px; left: 50%; transform: translateX(-50%);
  width: 40px; height: 26px;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mouth-contour {
  width: 20px;
  height: 4px;
  background: #be123c;
  border-radius: 8px;
  transition: all 0.07s ease;
  position: relative;
  overflow: hidden;
}
.mouth-contour::after {
  content: "";
  position: absolute;
  bottom: 0; left: 2px; right: 2px; height: 5px;
  background: #fda4af;
  border-radius: 50% 50% 0 0;
  opacity: 0;
}

/* Mulut bicara real-time saat audio aktif */
.avatar-viewport.speaking .mouth-contour {
  width: var(--mouth-w, 24px);
  height: var(--mouth-h, 14px);
  border-radius: 12px;
  background: #881337;
}
.avatar-viewport.speaking .mouth-contour::after {
  opacity: 1;
}

/* Front Bangs (Layered Hair Physics) */
.front-bangs {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 174px; height: 95px;
  z-index: 12;
  pointer-events: none;
}
.bang-strand {
  position: absolute;
  background: linear-gradient(180deg, #475569 0%, #334155 100%);
  border-radius: 0 0 20px 20px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  animation: hairStrandSway 3s ease-in-out infinite;
  transform-origin: top center;
}
.strand-1 { top: 0; left: 18px; width: 34px; height: 75px; transform: rotate(-5deg); animation-delay: 0s; }
.strand-2 { top: 0; left: 50px; width: 44px; height: 86px; animation-delay: 0.4s; }
.strand-3 { top: 0; right: 50px; width: 42px; height: 84px; animation-delay: 0.2s; }
.strand-4 { top: 0; right: 18px; width: 34px; height: 75px; transform: rotate(5deg); animation-delay: 0.6s; }

@keyframes hairStrandSway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(1.8deg); }
}

/* Side Pigtails / Tuft Swaying */
.side-tuft-l {
  position: absolute;
  top: 30px; left: -10px; width: 28px; height: 130px;
  background: #334155;
  border-radius: 0 0 20px 20px;
  z-index: 11;
  transform-origin: top right;
  animation: tuftSwayL 4s ease-in-out infinite;
}
.side-tuft-r {
  position: absolute;
  top: 30px; right: -10px; width: 28px; height: 130px;
  background: #334155;
  border-radius: 0 0 20px 20px;
  z-index: 11;
  transform-origin: top left;
  animation: tuftSwayR 4s ease-in-out infinite;
}
@keyframes tuftSwayL { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-3deg);} }
@keyframes tuftSwayR { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(3deg);} }

/* ── CHAT & CONTROLS UI ── */
.dialogue-dock {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: #111827;
}

.tutor-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.tutor-title h3 { font-size: 1.1rem; color: #818cf8; }
.tutor-title p { font-size: 0.75rem; color: #94a3b8; }

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  background: rgba(34, 197, 94, 0.15);
  color: #4ade80;
  border: 1px solid rgba(34, 197, 94, 0.3);
  padding: 4px 10px;
  border-radius: 20px;
}
.status-badge .dot {
  width: 6px; height: 6px; background: #22c55e; border-radius: 50%;
  animation: pulseDot 1.5s infinite;
}
@keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-right: 4px;
}

.chat-bubble {
  max-width: 90%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 0.9rem;
  line-height: 1.6;
  animation: popIn 0.25s ease-out;
}
@keyframes popIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.chat-bubble.tutor {
  background: rgba(99, 102, 241, 0.12);
  border: 1px solid rgba(99, 102, 241, 0.25);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.chat-bubble.user {
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.25);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.bubble-jp { font-size: 0.95rem; font-weight: 500; }
.bubble-kana { font-size: 0.72rem; color: #cbd5e1; opacity: 0.75; margin-top: 2px; }
.bubble-id { font-size: 0.75rem; color: #a5b4fc; margin-top: 4px; }

.controls-dock {
  display: flex;
  gap: 10px;
}
.mic-action-btn {
  flex: 1;
  background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.mic-action-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
}
.mic-action-btn.active {
  background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
  animation: pulseRecording 1.2s infinite;
}
@keyframes pulseRecording {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
  50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
}
</style>
</head>
<body>

<div class="stage-container">
  <!-- 2D AVATAR VIEWPORT (INTERACTIVE WITH MOUSE PARALLAX) -->
  <div class="avatar-viewport" id="avatarStage">
    <div class="light-spot"></div>

    <div class="live2d-rig" id="charRig">
      <!-- Back Hair -->
      <div class="back-hair"></div>
      
      <!-- Side Tuft Hair -->
      <div class="side-tuft-l"></div>
      <div class="side-tuft-r"></div>

      <!-- Torso & Suit -->
      <div class="rig-torso">
        <div class="uniform-suit">
          <div class="collar-v"></div>
          <div class="ribbon-tie"></div>
        </div>
      </div>

      <!-- Neck Joint -->
      <div class="rig-neck"></div>

      <!-- Head Structure -->
      <div class="rig-head" id="headRig">
        <!-- Face Canvas -->
        <div class="anime-face">
          <!-- Eyes Cluster -->
          <div class="eyes-cluster">
            <div class="eye-box">
              <div class="upper-lash"></div>
              <div class="iris-gem" id="irisL">
                <div class="highlight-large"></div>
                <div class="highlight-small"></div>
              </div>
              <div class="eyelid-curtain"></div>
            </div>
            <div class="eye-box">
              <div class="upper-lash"></div>
              <div class="iris-gem" id="irisR">
                <div class="highlight-large"></div>
                <div class="highlight-small"></div>
              </div>
              <div class="eyelid-curtain"></div>
            </div>
          </div>

          <!-- Blushing -->
          <div class="blush-glow blush-l"></div>
          <div class="blush-glow blush-r"></div>

          <!-- Lip Sync Mouth -->
          <div class="mouth-rig">
            <div class="mouth-contour" id="mouthContour"></div>
          </div>
        </div>

        <!-- Front Bangs Layer -->
        <div class="front-bangs">
          <div class="bang-strand strand-1"></div>
          <div class="bang-strand strand-2"></div>
          <div class="bang-strand strand-3"></div>
          <div class="bang-strand strand-4"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONVERSATION DOCK -->
  <div class="dialogue-dock">
    <div class="tutor-header">
      <div class="tutor-title">
        <h3>さくら先生 (Sakura-sensei)</h3>
        <p>AI Kaiwa Partner · Interactive Live2D Mode</p>
      </div>
      <div class="status-badge">
        <span class="dot"></span>
        <span>Mendengarkan</span>
      </div>
    </div>

    <!-- CHAT MESSAGES -->
    <div class="chat-scroll" id="chatList">
      <div class="chat-bubble tutor">
        <div class="bubble-jp">はじめまして！さくらです。今日から一緒に日本語を楽しく練習しましょう！</div>
        <div class="bubble-kana">Hajimemashite! Sakura desu. Kyou kara issho ni nihongo wo tanoshiku renshuu shimashou!</div>
        <div class="bubble-id">Senang berkenalan dengan Anda! Saya Sakura. Mari belajar bahasa Jepang bersama mulai hari ini!</div>
      </div>
    </div>

    <!-- MIC CONTROLS -->
    <div class="controls-dock">
      <button class="mic-action-btn" id="btnMic" onclick="toggleVoice()">
        <span id="micIcon" style="font-size:1.2rem;">🎤</span>
        <span id="micText">Tekan & Bicara (Mic)</span>
      </button>
    </div>
  </div>
</div>

<!-- GEMINI 3.8 FLASH CDN -->
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.3.0"
  }
}
</script>

<script type="module">
import { GoogleGenAI } from '@google/genai';

// ── MOUSE PARALLAX / EYE-TRACKING (MEMBUAT AVATAR 2D SANGAT HIDUP) ──
const stage = document.getElementById('avatarStage');
const rig = document.getElementById('charRig');
const head = document.getElementById('headRig');
const irisL = document.getElementById('irisL');
const irisR = document.getElementById('irisR');

stage.addEventListener('mousemove', (e) => {
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width - 0.5; // -0.5 sampai 0.5
  const y = (e.clientY - rect.top) / rect.height - 0.5;

  // Rotasi 3D ringan pada badan
  rig.style.setProperty('--rot-y', `${x * 16}deg`);
  rig.style.setProperty('--rot-x', `${-y * 10}deg`);

  // Gerakan bola mata mengikuti kursor pengguna
  const eyeX = x * 7;
  const eyeY = y * 6;
  irisL.style.transform = `translate(${eyeX}px, ${eyeY}px)`;
  irisR.style.transform = `translate(${eyeX}px, ${eyeY}px)`;

  // Kemiringan kepala halus
  head.style.setProperty('--head-tilt', `${x * 4}deg`);
});

stage.addEventListener('mouseleave', () => {
  rig.style.setProperty('--rot-y', `0deg`);
  rig.style.setProperty('--rot-x', `0deg`);
  irisL.style.transform = `translate(0px, 0px)`;
  irisR.style.transform = `translate(0px, 0px)`;
  head.style.setProperty('--head-tilt', `0deg`);
});

// ── NATURAL VOICE & REAL-TIME LIP-SYNC ──
const synth = window.speechSynthesis;
let japaneseVoice = null;

function fetchVoices() {
  const vList = synth.getVoices();
  japaneseVoice = vList.find(v => v.lang.startsWith('ja') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Nanami'))) ||
                  vList.find(v => v.lang.startsWith('ja')) || null;
}
fetchVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = fetchVoices;
}

function speakCharacter(text, onDone) {
  if (!synth) return;
  synth.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  if (japaneseVoice) utter.voice = japaneseVoice;
  utter.lang = 'ja-JP';
  utter.pitch = 1.25; // Karakter anime wanita ceria
  utter.rate = 1.0;

  const mouth = document.getElementById('mouthContour');
  let mouthTicker = null;

  utter.onstart = () => {
    stage.classList.add('speaking');
    mouthTicker = setInterval(() => {
      // Buka-tutup mulut acak yang pas dengan suku kata vokal Jepang (A, I, U, E, O)
      const h = Math.floor(Math.random() * 10) + 6;
      const w = Math.floor(Math.random() * 8) + 20;
      mouth.style.setProperty('--mouth-h', `${h}px`);
      mouth.style.setProperty('--mouth-w', `${w}px`);
    }, 75);
  };

  utter.onend = () => {
    stage.classList.remove('speaking');
    clearInterval(mouthTicker);
    mouth.style.setProperty('--mouth-h', `4px`);
    mouth.style.setProperty('--mouth-w', `20px`);
    if (onDone) onDone();
  };

  utter.onerror = () => {
    stage.classList.remove('speaking');
    clearInterval(mouthTicker);
  };

  synth.speak(utter);
}

// ── GEMINI 3.8 FLASH BRAIN ──
const savedKey = localStorage.getItem('GEMINI_KAIWA_KEY') || '';
let chat = null;

if (savedKey) {
  try {
    const ai = new GoogleGenAI({ apiKey: savedKey });
    chat = ai.chats.create({
      model: 'gemini-3.8-flash',
      config: {
        systemInstruction: `
Kamu adalah Sakura-sensei, seorang tutor bahasa Jepang anime wanita yang ramah, ekspresif, dan ceria.
Kamu sedang mengobrol santai dengan muridmu untuk melatih percakapan bahasa Jepang (Kaiwa).

ATURAN:
1. Jawab dalam 1-2 kalimat pendek dan santai (Desu/Masu yang ramah).
2. Format respons HARUS JSON persis:
{
  "jp": "Bahasa Jepang yang hidup dan ekspresif",
  "romaji": "Cara baca romaji",
  "id": "Arti bahasa Indonesia"
}
3. HANYA keluarkan JSON.
        `.trim()
      }
    });
  } catch(e) {
    console.error("Gemini init error:", e);
  }
}

// ── INPUT MIC (SPEECH TO TEXT) ──
let isRec = false;
let recognizer = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

window.toggleVoice = () => {
  if (!SR) {
    alert("Gunakan Google Chrome untuk fitur suara mic.");
    return;
  }
  const btn = document.getElementById('btnMic');

  if (!isRec) {
    recognizer = new SR();
    recognizer.lang = 'ja-JP';
    recognizer.continuous = false;

    recognizer.onstart = () => {
      isRec = true;
      btn.classList.add('active');
      document.getElementById('micText').textContent = 'Mendengarkan...';
    };

    recognizer.onresult = (e) => {
      const text = e.results[0][0].transcript;
      submitUserSpeech(text);
    };

    recognizer.onend = () => {
      isRec = false;
      btn.classList.remove('active');
      document.getElementById('micText').textContent = 'Tekan & Bicara (Mic)';
    };

    recognizer.start();
  } else {
    recognizer.stop();
  }
};

async function submitUserSpeech(userText) {
  addBubble('user', userText);

  try {
    const res = await chat.sendMessage({ message: userText });
    let raw = res.text.replace(/```json/g, '').replace(/```/g, '').trim();
    let data;
    try {
      data = JSON.parse(raw);
    } catch(err) {
      data = { jp: raw, romaji: "", id: "" };
    }

    addBubble('tutor', data.jp, data.romaji, data.id);
    speakCharacter(data.jp);

  } catch(e) {
    console.error(e);
  }
}

function addBubble(sender, jp, romaji, id) {
  const box = document.getElementById('chatList');
  const d = document.createElement('div');
  d.className = `chat-bubble ${sender}`;
  let html = `<div class="bubble-jp">${jp}</div>`;
  if (romaji) html += `<div class="bubble-kana">${romaji}</div>`;
  if (id) html += `<div class="bubble-id">${id}</div>`;
  d.innerHTML = html;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
