<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Kanji — SinauJepang</title>
<link rel="stylesheet" href="/assets/css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-fuji-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-fuji-200">
<!-- Header bersama: site-layout.js -->
<script src="/assets/js/indexeddb.js"></script>
<script src="/assets/js/site-layout.js"></script>
<main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
<!-- LAYER 1: kategori radikal -->
<section id="rLayer1" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
<div class="px-4 pt-4 pb-3 border-b border-slate-100 flex flex-wrap items-center gap-2">
<div class="mr-auto">
<h1 class="font-extrabold text-slate-800 text-[15px] leading-tight"><i class="fa-solid fa-language text-fuji-500 mr-1.5"></i>Kanji Explorer — Radikal</h1>
<p class="text-[11px] text-slate-500 mt-0.5">Pilih kategori → radikal → kanji → kosakata hafalan.</p>
</div>
<span id="jCount" class="text-[11px] font-bold text-slate-500 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-full"></span>
</div>
<div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-2" id="jCats"></div>
<div class="px-4 pb-3">
<input id="jCari" placeholder="Cari kanji / bacaan / arti langsung…" class="border border-slate-200 bg-white rounded-lg px-3 py-2 text-[13px] w-full focus:outline-none focus:ring-2 focus:ring-fuji-300">
</div>
<div class="p-4 pt-0 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 hidden" id="jSearchGrid"></div>
</section>
<!-- LAYER 2: pill radikal -->
<section id="rLayer2" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mt-4">
<div class="px-4 pt-4 pb-3 border-b border-slate-100 flex flex-wrap items-center gap-2">
<button onclick="window._jBack(1)" class="text-[12px] font-bold text-fuji-600 hover:text-fuji-700">← Kategori</button>
<div class="mr-auto"><h2 class="font-extrabold text-slate-800 text-[15px]" id="jCatTitle">Radikal</h2></div>
</div>
<div class="p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2" id="jRads"></div>
</section>
<!-- LAYER 3: kartu kanji + detail -->
<section id="rLayer3" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mt-4">
<div class="px-4 pt-4 pb-3 border-b border-slate-100 flex flex-wrap items-center gap-2">
<button onclick="window._jBack(2)" class="text-[12px] font-bold text-fuji-600 hover:text-fuji-700">← Radikal</button>
<div class="mr-auto"><h2 class="font-extrabold text-slate-800 text-[15px]" id="jRadTitle">Kanji</h2></div>
<span id="jKanjiCount" class="text-[11px] font-bold text-slate-500 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-full"></span>
</div>
<div class="p-4 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2" id="jGrid"></div>
<div id="jDetail" class="px-4 pb-4"></div>
</section>
</main>
<script src="/assets/js/explorer-data.js"></script>
<script src="/assets/js/kanji.js"></script>
<script src="/assets/js/kanji-detail.js"></script>
</body>
</html>
