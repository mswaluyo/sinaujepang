<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .jp-font { font-family: 'Noto Sans JP', sans-serif; }
    .jp-kanji-clear {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .kanji-highlight-blue {
      color: #0284c7 !important; /* sky/blue solid */
      font-weight: 700 !important;
    }
    .kanji-box-tunggal {

      border-color: #7dd3fc !important;
      background-color: #ffffff !important;
      font-weight: 700 !important;
    }

    .banner-kanji-explorer {

    .control-toolbar {

      display: flex;

      width: 360px;

    .search-group-container {
      flex: 1;

      position: relative;

    .search-input-field {
      width: 100%;

    }
    .search-clear-btn {

      right: 10px;

      color: #94a3b8;

      border: none;

    @media (max-width: 768px) {
      .control-toolbar {
        flex-direction: column;

    .tab-btn {
      flex: 1 1 50%;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: #64748b;
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

      color: #0f172a;

      color: #ffffff !important;

    /* Mobile Enhancements & Responsiveness */
    @media (max-width: 640px) {

<body class="bg-fuji-50 text-slate-800 min-h-screen flex flex-col selection:bg-sky-100 selection:text-sky-800">
  <script src="/assets/js/indexeddb.js"></script>
  <script src="/assets/js/site-layout.js"></script>

  <main class="max-w-6xl mx-auto px-2 sm:px-4 py-4 sm:py-8 flex-grow w-full">
    <!-- Header Banner -->
    <div class="banner-kanji-explorer rounded-2xl sm:rounded-3xl p-5 sm:p-7 shadow-xl shadow-blue-500/15 mb-4 sm:mb-6 relative overflow-hidden">
      <div class="relative z-10 max-w-3xl">
        <h1 class="text-xl sm:text-3xl font-extrabold tracking-tight mb-2 text-white">Kanji &amp; Kotoba Standar JFT-A2</h1>
        <p class="banner-subtext text-xs sm:text-sm leading-relaxed">
          Eksplorasi lengkap <strong class="text-white">273 Kanji</strong> berbasis pohon radikal (Kanji Explorer) dan <strong class="text-white">Daftar Kotoba A2</strong> terintegrasi.
        </p>
      </div>
    </div>

    <!-- Controls (1 Baris Penuh: Tab Kanji + Tab Kotoba + Search Box) -->

      <!-- Tab Switcher -->
      <div class="tab-group-container">
        <button id="tab-tabel-kanji" class="tab-btn active">
          <i class="fa-solid fa-table"></i> Tabel Kanji Standar
        </button>
        <button id="tab-kotoba" class="tab-btn">
          <i class="fa-solid fa-book-open"></i> Daftar Kotoba A2
        </button>
      </div>

      <!-- Search Input (Lensa Pas & Bebas Halangan Ketik) -->
      <div class="search-group-container">
        <i class="fa-solid fa-magnifying-glass search-lens-icon"></i>
        <input id="input-search" type="text" placeholder="Cari kanji, radikal, arti, cara baca (Romaji/Kana)..."

    <!-- VIEW 1: TABEL KANJI STANDAR DENGAN SEPARATOR -->

          <i class="fa-solid fa-compass text-sky-600"></i> Lompat Grup Explorer:
        </div>
        <div id="group-shortcuts" class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-thin">

      <!-- Main Kanji Table -->
      <div class="bg-white rounded-xl sm:rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="overflow-x-auto -webkit-overflow-scrolling-touch">
          <table class="w-full text-left border-collapse mobile-table">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-200 text-[11px] sm:text-xs font-bold text-slate-600 uppercase tracking-wider sticky top-0 z-20 shadow-xs">
                <th class="py-3 px-2 sm:px-4 w-12 sm:w-16 text-center">No</th>
                <th class="py-3 px-3 sm:px-4 min-w-[180px] sm:w-80">Kanji &amp; Tree</th>

              </tr>
            </thead>
            <tbody id="kanji-table-body" class="text-xs sm:text-sm divide-y divide-slate-100">
              <!-- Rendered by JS with Group, Radical & Kanji Subheaders -->

    </section>

    <!-- VIEW 2: DAFTAR KOTOBA LENGKAP -->
    <section id="view-kotoba-table" class="hidden space-y-4">
      <div class="bg-white rounded-xl sm:rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="overflow-x-auto -webkit-overflow-scrolling-touch">
          <table class="w-full text-left border-collapse mobile-table">
            <thead>
              <tr class="bg-slate-50/80 border-b border-slate-200 text-[11px] sm:text-xs font-bold text-slate-500 uppercase tracking-wider">
                <th class="py-2.5 sm:py-3.5 px-2 sm:px-4 w-10 sm:w-14 text-center">No</th>
                <th class="py-2.5 sm:py-3.5 px-2 sm:px-4 min-w-[110px] sm:w-44">Kanji</th>
                <th class="py-2.5 sm:py-3.5 px-2 sm:px-4 min-w-[140px]">Cara Baca</th>
                <th class="py-2.5 sm:py-3.5 px-2 sm:px-4 min-w-[140px]">Arti Indonesia</th>
                <th class="py-2.5 sm:py-3.5 px-2 sm:px-4 min-w-[100px] sm:w-36">Kategori</th>
              </tr>
            </thead>
            <tbody id="kotoba-table-body" class="divide-y divide-slate-100 text-xs sm:text-sm">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

  </main>

  <script>
    let kanjiData = [];
    let kotobaData = [];
    let currentView = 'kanji';
    let searchQuery = '';

    const tabKanji = document.getElementById('tab-tabel-kanji');
    const tabKotoba = document.getElementById('tab-kotoba');
    const viewKanji = document.getElementById('view-kanji-table');
    const viewKotoba = document.getElementById('view-kotoba-table');
    const kanjiTableBody = document.getElementById('kanji-table-body');
    const kotobaTableBody = document.getElementById('kotoba-table-body');
    const inputSearch = document.getElementById('input-search');
    const btnClearSearch = document.getElementById('btn-clear-search');
    const groupShortcuts = document.getElementById('group-shortcuts');

    
    // Helper Tabel Transliterasi Kana ke Romaji (Lafal)
    const ROMAJI_TABLE = {
      'あ': 'a', 'い': 'i', 'う': 'u', 'え': 'e', 'お': 'o',
      'か': 'ka', 'き': 'ki', 'く': 'ku', 'け': 'ke', 'こ': 'ko',
      'さ': 'sa', 'し': 'shi', 'す': 'su', 'せ': 'se', 'そ': 'so',
      'た': 'ta', 'ち': 'chi', 'つ': 'tsu', 'て': 'te', 'と': 'to',
      'な': 'na', 'に': 'ni', 'ぬ': 'nu', 'ね': 'ne', 'の': 'no',
      'は': 'ha', 'ひ': 'hi', 'ふ': 'fu', 'へ': 'he', 'ほ': 'ho',
      'ま': 'ma', 'み': 'mi', 'む': 'mu', 'め': 'me', 'も': 'mo',
      'や': 'ya', 'ゆ': 'yu', 'よ': 'yo',
      'ら': 'ra', 'り': 'ri', 'る': 'ru', 'れ': 're', 'ろ': 'ro',
      'わ': 'wa', 'を': 'o', 'ん': 'n',
      'が': 'ga', 'ぎ': 'gi', 'ぐ': 'gu', 'げ': 'ge', 'ご': 'go',
      'ざ': 'za', 'じ': 'ji', 'ず': 'zu', 'ぜ': 'ze', 'ぞ': 'zo',
      'だ': 'da', 'ぢ': 'ji', 'づ': 'zu', 'で': 'de', 'ど': 'do',
      'ば': 'ba', 'び': 'bi', 'ぶ': 'bu', 'べ': 'be', 'ぼ': 'bo',
      'ぱ': 'pa', 'ぴ': 'pi', 'ぷ': 'pu', 'ぺ': 'pe', 'ぽ': 'po',
      'きゃ': 'kya', 'きゅ': 'kyu', 'きょ': 'kyo',
      'しゃ': 'sha', 'しゅ': 'shu', 'しょ': 'sho',
      'ちゃ': 'cha', 'ちゅ': 'chu', 'ちょ': 'cho',
      'にゃ': 'nya', 'にゅ': 'nyu', 'にょ': 'nyo',
      'ひゃ': 'hya', 'ひゅ': 'hyu', 'ひょ': 'hyo',
      'みゃ': 'mya', 'みゅ': 'myu', 'みょ': 'myo',
      'りゃ': 'rya', 'りゅ': 'ryu', 'りょ': 'ryo',
      'ぎゃ': 'gya', 'ぎゅ': 'gyu', 'ぎょ': 'gyo',
      'じゃ': 'ja', 'じゅ': 'ju', 'じょ': 'jo',
      'びゃ': 'bya', 'びゅ': 'byu', 'びょ': 'byo',
      'ぴゃ': 'pya', 'ぴゅ': 'pyu', 'ぴょ': 'pyo'
    };

    function transliterateKana(str) {
      if (!str) return '';
      let res = '';
      let i = 0;
      while (i < str.length) {
        if (str[i] === 'っ') {
          const nextTwo = str.slice(i + 1, i + 3);
          const nextOne = str[i + 1];
          const nextRom = ROMAJI_TABLE[nextTwo] || ROMAJI_TABLE[nextOne];
          if (nextRom) res += nextRom[0];
          i++;
          continue;
        }
        const two = str.slice(i, i + 2);
        if (ROMAJI_TABLE[two]) {
          res += ROMAJI_TABLE[two];
          i += 2;
          continue;
        }
        const one = str[i];
        if (ROMAJI_TABLE[one]) {
          res += ROMAJI_TABLE[one];
        } else {
          res += one;
        }
        i++;
      }
      return res;
    }

    function parseKunyomi(str) {
      const tokens = str.split('・');
      if (tokens.length <= 1) return [transliterateKana(str)];
      if (tokens.length === 2) {
        if (tokens[1].length <= 2 && ['る', 'す', 'く', 'ぐ', 'つ', 'ぬ', 'ぶ', 'む', 'う', 'い', 'れる', 'まる', 'める', 'がる', 'ける', 'かす', 'せる', 'ちる', 'とす', 'わる', 'える', 'りる'].includes(tokens[1])) {
          return [transliterateKana(tokens[0] + tokens[1])];
        }
        return [transliterateKana(tokens[0]), transliterateKana(tokens[1])];
      }
      if (tokens.length % 2 === 0) {
        let res = [];
        for (let i = 0; i < tokens.length; i += 2) {
          res.push(transliterateKana(tokens[i] + tokens[i + 1]));
        }
        return res;
      }
      return tokens.map(transliterateKana);
    }

    function kanaToRomaji(rawText, isOnyomi) {
      if (!rawText || rawText === '-') return '';
      let text = rawText.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
      if (isOnyomi) {
        return text.split(/[・\/\s、]+/).filter(Boolean).map(transliterateKana).join(', ');
      }
      const slashGroups = text.split(/[\/\s、]+/).filter(Boolean);
      const words = [];
      slashGroups.forEach(g => {
        words.push(...parseKunyomi(g));
      });
      return words.join(', ');
    }

    async function init() {
      try {
        const [resKanji, resKotoba] = await Promise.all([
          fetch('/kanji-jft-a2.json'),
          fetch('/kotoba-lolosyuk.json')
        ]);
        kanjiData = await resKanji.json();
        kotobaData = await resKotoba.json();

// stats counter in banner removed

        buildGroupShortcuts();
        renderKanjiTable();
        renderKotobaTable();
      } catch (err) {
        console.error("Gagal memuat data:", err);
      }
    }

    // Bangun tombol pintasan navigasi grup Kanji Explorer
    function buildGroupShortcuts() {
      const groups = [...new Set(kanjiData.map(k => k.grupRadikal))];
      groupShortcuts.innerHTML = groups.map((g, idx) => {
        return `
          <a href="#grup-${idx}" class="px-2.5 py-1 bg-slate-100 hover:bg-sky-100 text-slate-700 hover:text-sky-800 rounded-lg text-xs font-semibold transition-colors">
            ${g}
          </a>
        `;
      }).join('');
    }

    // Render Tabel Kanji: Grup Radikal -> Radikal -> Header Kanji -> Baris Kotoba
    function renderKanjiTable() {
      let filtered = kanjiData;

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(k => {
          const matchKanji = (k.kanji && k.kanji.includes(q));
          const matchRadical = (k.radical && k.radical.includes(q));
          const matchGrup = (k.grupRadikal && k.grupRadikal.toLowerCase().includes(q));
          const matchNamaRad = (k.namaRadikal && k.namaRadikal.toLowerCase().includes(q));
          const matchArti = (k.arti && k.arti.toLowerCase().includes(q));
          const matchKun = (k.kun && k.kun.toLowerCase().includes(q));
          const matchOn = (k.on && k.on.toLowerCase().includes(q));
          const kunRomaji = k.kun ? kanaToRomaji(k.kun, false).toLowerCase() : '';
          const onRomaji = k.on ? kanaToRomaji(k.on, true).toLowerCase() : '';
          const matchRomaji = kunRomaji.includes(q) || onRomaji.includes(q);
          const radKana = k.radMeta?.kana ? k.radMeta.kana.toLowerCase() : '';
          const radRom = k.radMeta?.romaji ? k.radMeta.romaji.toLowerCase() : '';
          const radArti = k.radMeta?.arti ? k.radMeta.arti.toLowerCase() : '';
          const matchRadMeta = radKana.includes(q) || radRom.includes(q) || radArti.includes(q);
          const matchVocab = k.vocab && k.vocab.some(v => 
            (v.kanji && v.kanji.includes(q)) ||
            (v.kana && v.kana.toLowerCase().includes(q)) ||
            (v.rom && v.rom.toLowerCase().includes(q)) ||
            (v.arti && v.arti.toLowerCase().includes(q))
          );
          return matchKanji || matchRadical || matchGrup || matchNamaRad || matchArti || matchKun || matchOn || matchRomaji || matchRadMeta || matchVocab;
        });
      }

      if (filtered.length === 0) {
        kanjiTableBody.innerHTML = `
          <tr>
            <td colspan="4" class="py-12 text-center text-slate-400">
              <i class="fa-regular fa-face-frown text-3xl mb-2"></i>
              <p class="text-sm">Tidak ada kosakata yang cocok dengan pencarian.</p>
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      let currentGrup = null;
      let currentRadical = null;
      let groupIdx = 0;
      let rowCounter = 0;

      filtered.forEach((k) => {
        // 1. Tingkat 0: Grup Radikal (Akar / Folder Utama)
        if (k.grupRadikal !== currentGrup) {
          currentGrup = k.grupRadikal;
          currentRadical = null;
          groupIdx++;
          html += `
            <tr id="grup-${groupIdx - 1}" class="separator-group text-white">
              <td colspan="4" class="py-3 px-4 font-black tracking-wide text-sm sm:text-base">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-sky-200"></i>
                    <span>${currentGrup}</span>
                  </div>
                  <span class="text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-bold">Kategori Utama</span>
                </div>
              </td>
            </tr>
          `;
        }

        // 2. Tingkat 1: Header Radikal (Elegan & Selaras: Kanji, Kana, Romaji Lafal, Arti, Coretan)
        if (k.radical !== currentRadical) {
          currentRadical = k.radical;
          const rMeta = k.radMeta || { kana: '', romaji: '', arti: '' };
          html += `
            <tr class="separator-radical text-slate-800 border-t-2 border-sky-300">
              <td colspan="4" class="py-2.5 px-3 sm:px-4 bg-slate-100/90 border-b border-slate-200">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5">
                    <span class="w-7 h-7 rounded-lg bg-sky-600 text-white flex items-center justify-center font-black jp-font text-base shadow-xs select-none">
                      ${currentRadical}
                    </span>
                    <div class="flex flex-col sm:flex-row sm:items-baseline gap-0.5 sm:gap-2">
                      <div class="flex items-baseline gap-1.5">
                        <span class="text-sky-900 font-bold jp-font text-sm">${rMeta.kana || ''}</span>
                        <span class="text-xs font-mono font-medium text-slate-500">${rMeta.romaji ? '(' + rMeta.romaji + ')' : ''}</span>
                      </div>
                      ${rMeta.arti ? `<span class="text-xs text-slate-700 font-semibold">— ${rMeta.arti}</span>` : ''}
                    </div>
                  </div>
                  <span class="text-[11px] text-sky-800 bg-sky-100 border border-sky-200/80 px-2.5 py-0.5 rounded-full font-bold self-center">
                    ${k.strokeRadikal} coretan
                  </span>
                </div>
              </td>
            </tr>
          `;
        }

        // 3. Tingkat 2: Kanji Induk (Level 2) - Tampilkan Kana & Lafal Tanpa Label On/Kun
        const readings = [];
        if (k.kun && k.kun !== '-') {
          readings.push({
            kana: k.kun,
            romaji: kanaToRomaji(k.kun, false),
            color: 'text-sky-700',
            romColor: 'text-sky-600/80'
          });
        }
        if (k.on && k.on !== '-') {
          readings.push({
            kana: k.on,
            romaji: kanaToRomaji(k.on, true),
            color: 'text-amber-800',
            romColor: 'text-amber-700/80'
          });
        }

        const bacaanHtml = readings.length > 0
          ? readings.map(r => `
              <div class="flex flex-col">
                <span class="font-bold jp-font text-sm sm:text-base leading-tight ${r.color}">${r.kana}</span>
                <span class="text-xs font-mono font-medium tracking-tight mt-0.5 ${r.romColor}">${r.romaji}</span>
              </div>
            `).join('<span class="text-slate-300 font-light select-none self-center">|</span>')
          : '<span class="text-slate-400 text-xs italic">-</span>';

        html += `
          <tr class="bg-sky-50/70 border-t border-sky-200/80 hover:bg-sky-100/50 transition-colors">
            <td class="py-2.5 px-4 text-center text-xs font-bold text-sky-500">
              <i class="fa-solid fa-diamond text-[8px]"></i>
            </td>
            <td class="py-2.5 px-4" style="padding-left: 1.25rem;">
              <div class="flex items-center gap-2">
                <span class="text-sky-500 font-mono text-base font-bold select-none">└──</span>
                <span class="w-9 h-9 inline-flex items-center justify-center kanji-box-tunggal border rounded-lg text-2xl jp-kanji-clear shadow-xs">
                  ${k.kanji}
                </span>
                <span class="text-[10px] text-sky-700 bg-sky-100 border border-sky-200 px-2 py-0.5 rounded-full font-bold ml-1">${k.stroke} coretan</span>
              </div>
            </td>
            <td class="py-2.5 px-4">
              <div class="flex items-center gap-3">
                ${bacaanHtml}
              </div>
            </td>
            <td class="py-2.5 px-4 font-bold text-slate-800 text-sm">
              ${k.arti || '-'}
            </td>
          </tr>
        `;

        // 4. Tingkat 3: Baris Kotoba Turunan (Level 3 - Menjorok Jauh ke Kanan: 56px)
        if (k.vocab && k.vocab.length > 0) {
          k.vocab.forEach((v, vIdx) => {
            rowCounter++;
            const isLastVocab = vIdx === k.vocab.length - 1;
            const treeBranch = isLastVocab ? '└──' : '├──';
            // Highlight karakter kanji yang sama dengan kanji tunggal induknya
            const parentChar = k.kanji;
            const highlightedKanji = Array.from(v.kanji).map(ch => {
              if (ch === parentChar) {
                return `<span class="kanji-highlight-blue">${ch}</span>`;
              }
              return `<span class="text-slate-700">${ch}</span>`;
            }).join('');

            html += `
              <tr class="hover:bg-sky-50/20 transition-colors">
                <td class="py-2.5 px-4 text-center text-xs text-slate-400 font-semibold">${rowCounter}</td>
                <td class="py-2.5 px-4" style="padding-left: 3.75rem;">
                  <div class="flex items-center gap-2">
                    <span class="text-slate-300 font-mono text-sm select-none font-bold">${treeBranch}</span>
                    <span class="text-lg jp-kanji-clear bg-slate-50 px-2.5 py-0.5 rounded border border-slate-200">
                      ${highlightedKanji}
                    </span>
                  </div>
                </td>
                <td class="py-2.5 px-4">
                  <div class="font-medium text-sky-700 jp-font">${v.kana}</div>
                  <div class="text-xs text-slate-400 font-medium mt-0.5">${v.rom}</div>
                </td>
                <td class="py-2.5 px-4 font-normal text-slate-700">
                  ${v.arti}
                </td>
              </tr>
            `;
          });
        }
      });

      kanjiTableBody.innerHTML = html;
      const counterText = document.getElementById('search-counter-text');
      const counterBadge = document.getElementById('search-counter-badge');
      if (counterText && counterBadge) {
        if (searchQuery.trim()) {
          counterBadge.classList.remove('hidden');
          counterText.innerText = `${filtered.length} Kanji (${rowCounter} Kosakata)`;
        } else {
          counterText.innerText = `Total ${kanjiData.length} Kanji`;
        }
      }
    }

    // Render Tabel Kotoba
    function renderKotobaTable() {
      let filtered = kotobaData;
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(k => 
          k.kanji.toLowerCase().includes(q) ||
          k.kana.toLowerCase().includes(q) ||
          k.rom.toLowerCase().includes(q) ||
          k.arti.toLowerCase().includes(q)
        );
      }

      if (filtered.length === 0) {
        kotobaTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-slate-400">
              <i class="fa-regular fa-face-frown text-3xl mb-2"></i>
              <p class="text-sm">Tidak ada kosakata yang cocok dengan pencarian.</p>
            </td>
          </tr>
        `;
        return;
      }

      kotobaTableBody.innerHTML = filtered.map((k, i) => `
        <tr class="hover:bg-sky-50/20 transition-colors">
          <td class="py-2.5 px-4 text-center text-xs text-slate-400 font-semibold">${i + 1}</td>
          <td class="py-2.5 px-4">
            <span class="text-slate-900 text-lg jp-kanji-clear bg-slate-50 px-2.5 py-0.5 rounded border border-slate-200 text-blue-600 font-semibold">
              ${k.kanji}
            </span>
          </td>
          <td class="py-2.5 px-4">
            <div class="font-medium text-sky-700 jp-font">${k.kana}</div>
            <div class="text-xs text-slate-400 font-medium mt-0.5">${k.rom}</div>
          </td>
          <td class="py-2.5 px-4 font-normal text-slate-700">
            ${k.arti || '-'}
          </td>
          <td class="py-2.5 px-4">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${k.keterangan?.includes('LOLOSYUK') ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}">
              ${k.keterangan || 'JFT-A2'}
            </span>
          </td>
        </tr>
      `).join('');
    }

    // Tab Switching Konsisten
    tabKanji.onclick = () => {
      currentView = 'kanji';
      tabKanji.classList.add('active');
      tabKotoba.classList.remove('active');
      viewKanji.classList.remove('hidden');
      viewKotoba.classList.add('hidden');
    };

    tabKotoba.onclick = () => {
      currentView = 'kotoba';
      tabKotoba.classList.add('active');
      tabKanji.classList.remove('active');
      viewKotoba.classList.remove('hidden');
      viewKanji.classList.add('hidden');
    };

    // Live Search
    inputSearch.oninput = (e) => {
      searchQuery = e.target.value;
      if (searchQuery.trim().length > 0) {
        btnClearSearch.classList.remove('hidden');
      } else {
        btnClearSearch.classList.add('hidden');
      }
      if (currentView === 'kanji') renderKanjiTable();
      else renderKotobaTable();
    };

    btnClearSearch.onclick = () => {
      inputSearch.value = '';
      searchQuery = '';
      btnClearSearch.classList.add('hidden');
      inputSearch.focus();
      if (currentView === 'kanji') renderKanjiTable();
      else renderKotobaTable();
    };

    init();
  </script>
</body>
</html>
