<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Soal — SinauJepang</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/site.css">
<style>
@media print {
  .no-print { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  .soal { page-break-inside: avoid; }
}
</style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-8 font-sans">
<div class="max-w-4xl mx-auto">
<div class="no-print bg-white border border-slate-200 rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-3 shadow-sm">
  <div>
    <h1 class="font-bold text-lg text-slate-800" id="cTitle">Cetak Soal</h1>
    <p class="text-xs text-slate-400" id="cSub">Memuat...</p>
  </div>
  <div class="flex items-center gap-2">
    <button onclick="window.print()" class="bg-fuji-600 hover:bg-fuji-700 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow">Cetak / Simpan PDF</button>
    <a href="/simulasi.html" id="cBack" class="text-xs font-semibold text-slate-600 hover:text-slate-900 border border-slate-200 px-3 py-2 rounded-xl">← Kembali</a>
  </div>
</div>
<div id="cSheet" class="bg-white border border-slate-200 rounded-2xl p-6"></div>
</div>
<script>
(function(){
  function q(n){ try{ return new URLSearchParams(location.search).get(n) || ""; }catch(e){ return ""; } }
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  var slug = (q("paket") || "gakusei-quiz").toLowerCase();
  document.getElementById("cTitle").textContent = "Cetak Soal — " + slug.replace("-quiz","").toUpperCase();
  document.getElementById("cBack").href = "/simulasi.html";
  function optText(o){ if (o == null) return ""; if (typeof o === "string") return o; return o.text || o.label || ""; }

  function assetUrl(p) {
    if (!p) return "";
    if (/^(https?:)?\/\//i.test(p) || p.charAt(0) === "/") return p;
    var rel = String(p).replace(/^\.\//, "").replace(/^assets\//i, "");
    var ext = rel.split('.').pop().toLowerCase();
    var sub = "";
    if (/^(png|jpe?g|gif|svg|webp)$/i.test(ext)) sub = "images";
    else if (/^(mp3|wav|ogg|m4a)$/i.test(ext)) sub = "audio";
    var basePath = "/assets/quizzes/" + slug + "/";
    if (sub) basePath += sub + "/";
    return basePath + rel;
  }

  fetch("/quizzes/" + slug + "/quiz-data.json", { cache: "no-store" }).then(function(r){
    if (!r.ok) throw new Error("Status " + r.status);
    return r.json();
  }).then(function(d){
    var items = Array.isArray(d) ? d : (d.items || d.questions || []);
    document.getElementById("cSub").textContent = items.length + " soal • kunci jawaban di halaman terakhir";
    document.title = "Soal " + slug.replace("-quiz","").toUpperCase() + " — SinauJepang";
    var h = "<div style='text-align:center;margin-bottom:18px'><div style='font-size:20px;font-weight:900'>SinauJepang 模擬試験</div><div style='font-size:12px;color:#64748b'>Paket " + esc(slug.replace("-quiz","").toUpperCase()) + " • " + items.length + " soal</div></div>";
    var kunci = [];
    items.forEach(function(s, i){
      var no = s.no || (i + 1);
      var imgSrc = s.img || s.image || "";
      h += "<div class='soal' style='border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:12px'>";
      h += "<div style='font-weight:800;font-size:13px;margin-bottom:6px'>Soal " + no + " <span style='font-weight:400;color:#94a3b8;font-size:11px'>" + esc(s.section || "") + "</span></div>";
      if (imgSrc) h += "<div style='margin-bottom:6px;text-align:center'><img src='" + esc(assetUrl(imgSrc)) + "' style='max-width:320px;max-height:260px;object-fit:contain;border-radius:8px;border:1px solid #e2e8f0;display:inline-block' loading='lazy'></div>";
      if (s.title && !/^soal\s*\d+$/i.test(s.title.trim())) h += "<div style='font-size:13px;margin-bottom:6px;white-space:pre-line'>" + esc(s.title) + "</div>";
      var opts = s.options || [];
      var ABJ = ["A","B","C","D","E","F"];
      h += "<div style='display:grid;gap:4px'>";
      opts.forEach(function(o, j){
        h += "<div style='font-size:13px'><b>" + (ABJ[j] || (j+1)) + ".</b> " + esc(optText(o)) + "</div>";
      });
      h += "</div></div>";
      var ans = s.answer;
      kunci.push("<tr><td style='border:1px solid #e2e8f0;padding:4px 10px;text-align:center'>" + no + "</td><td style='border:1px solid #e2e8f0;padding:4px 10px;text-align:center;font-weight:800'>" + (ABJ[ans] || "-") + "</td></tr>");
    });
    h += "<div class='soal' style='margin-top:18px'><div style='font-weight:900;font-size:14px;margin-bottom:8px'>Kunci Jawaban</div><table style='border-collapse:collapse;font-size:13px'><tr><th style='border:1px solid #e2e8f0;padding:4px 10px;background:#f8fafc'>No</th><th style='border:1px solid #e2e8f0;padding:4px 10px;background:#f8fafc'>Kunci</th></tr>" + kunci.join("") + "</table></div>";
    document.getElementById("cSheet").innerHTML = h;
  }).catch(function(err){
    document.getElementById("cSheet").innerHTML = "<p style='color:#e11d48'>Gagal memuat soal: " + esc(err.message || err) + "</p>";
  });
})();
</script>
</body>
</html>
