<!DOCTYPE html>
<html>
<head>
<title>Hafalan Kosakata</title>
<link rel=stylesheet href=/assets/css/tailwind.css>
<style>
.badge { display:inline-block; font-weight:bold; padding:2px 4px; border-radius:4px; }
.table th, .table td { padding:4px 8px; border:1px solid #e5e7eb; }
</style>
</head>
<body>
<h1>Hafalan Kosakata</h1>
<input id=kCari placeholder=Search>
<select id=kJenis><option value=>All</option><option value=V>Verb</option><option value=A>Adjective</option><option value=N>Noun</option><option value=U>Expression</option></select>
<select id=kPaket><option value=>All Paket</option></select>
<button onclick=loadData()>Refresh</button>
<div id=kCount></div>
<table id=kTable><thead><tr><th>Kanji</th><th>Kana</th><th>Romaji</th><th>Arti</th><th>Jenis</th><th>Paket</th></tr></thead>
<tbody id=kRows></tbody>
</table>
<script>
let allData = [];
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render() {
  const tbody = document.getElementById('kRows');
  const kw = document.getElementById('kCari').value.toLowerCase();
  const jn = document.getElementById('kJenis').value;
  const pk = document.getElementById('kPaket').value;
  let list = allData.filter(o => { if (jn && o.jenis!==jn) return false; if (pk && !o.paket.includes(pk)) return false; if (kw && !((o.kanji+' '+o.kana+' '+o.rom+' '+o.arti).toLowerCase().includes(kw))) return false; return true; });
  list.sort((a,b) => a.kanji.localeCompare(b.kanji, 'ja'));
  document.getElementById('kCount').textContent = list.length + ' kosakata';
  let html = '';
  for (let i=0; i<Math.min(200, list.length); i++) {
    const o = list[i];
    html += '<tr><td>'+esc(o.kanji)+'</td><td>'+esc(o.kana)+'</td><td>'+esc(o.rom)+'</td><td>'+esc(o.arti)+'</td><td>'+o.jenis+'</td><td>'+o.paket.join(', ')+'</td></tr>';
  }
  tbody.innerHTML = html || '<tr><td colspan=6>No data</td></tr>';
  const more = document.getElementById('kMore');
  more.disabled = shown >= list.length;
}
function loadData() {
  fetch('/kosakata.json').then(r => r.json()).then(j => {
    allData = (j.data || []).map(o => ({ kanji: o.kanji, kana: o.kana, rom: o.rom, arti: o.arti, jenis: 'N', paket: o.paket }));
    render();
  }).catch(function(e) { alert('Error: ' + e); });
}
document.addEventListener('DOMContentLoaded', function() { loadData(); });
</script>
</body>
</html>
