<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Simulasi Ujian SSW - SinauJepang</title>
  
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/quiz.css">
</head>
<body class="bg-fuji-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-200">

  <!-- Header Navbar Model JFT (Timer, Judul Paket, Tombol Hasil & Rekap) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo SinauJepang Standar Aplikasi -->
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-fuji-600 to-fuji-400 flex items-center justify-center text-white font-bold shadow-md shadow-fuji-500/20">
          <span class="text-xs font-extrabold tracking-tighter">学び</span>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-slate-800 text-lg leading-tight">SinauJepang</span>
          <span class="text-[10px] text-fuji-600 font-semibold tracking-wider uppercase">SIMULASI RESMI SSW</span>
        </div>
      </a>

      <!-- Right Controls: Timer, Paket Name, Hasil & Rekap Button -->
      <div class="flex items-center gap-3">
        
        <!-- Live Timer Badge (contoh: 00:30) -->
        <div class="flex items-center gap-2 bg-emerald-50 px-3.5 py-1.5 rounded-full border border-emerald-200 text-xs font-semibold text-emerald-800 shadow-xs">
          <i class="fa-regular fa-clock text-emerald-600"></i>
          <span id="ssw-timer-display" class="font-mono font-bold text-sm tracking-wide">00:00</span>
        </div>

        <!-- Nama Paket Ujian (contoh: SSW PETERNAKAN) -->
        <div class="hidden md:block text-xs font-black text-slate-800 tracking-wide uppercase px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200" id="ssw-top-paket">
          SSW
        </div>

        <!-- Tombol Hasil & Rekap -->
        <button onclick="window.SSWModule.openResultModal()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold px-4 py-2 rounded-full text-xs sm:text-sm shadow-md shadow-emerald-600/25 transition-all">
          <i class="fa-solid fa-square-poll-vertical"></i>
          <span>Hasil &amp; Rekap</span>
        </button>

      </div>
    </div>

    <!-- Garis Progress Bar Global Tipis di bawah Header -->
    <div class="w-full bg-slate-100 h-1.5">
      <div id="ssw-top-progress" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-1.5 w-0 transition-all duration-300"></div>
    </div>
  </header>

  <!-- Container Utama Kuis SSW -->
  <main class="flex-grow w-full py-6 md:py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto" id="ssw-content">
      <!-- Loading Placeholder -->
      <div class="p-12 text-center bg-white rounded-2xl border border-slate-200 shadow-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-600 mb-3 block"></i>
        <span class="text-sm font-bold text-slate-600">Memuat Bank Soal SSW...</span>
      </div>
    </div>
  </main>

  <!-- Menonaktifkan chrome default header agar memakai header kustom SSW di atas -->
  <script>window.SITE_NO_CHROME = true;</script>
  <script src="/assets/js/indexeddb.js"></script>
  <script src="/assets/js/site-layout.js"></script>
  <script type="module" src="/assets/js/firebase-init.js"></script>

  <!-- Script Khusus Modul SSW -->
  <script src="/assets/js/ssw-quiz.js"></script>
</body>
</html>
