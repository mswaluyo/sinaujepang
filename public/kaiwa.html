<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom Kaiwa Practice - Sinau Jepang</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Import map untuk Three.js dan @pixiv/three-vrm -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.min.js"
      }
    }
  </script>

  <style>
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      margin: 0;
    }
    .video-tile {
      background: #1e1e24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .active-speaker {
      border: 2px solid #22c55e !important;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none">

  <!-- ── 1. ZOOM TOP BAR ── -->
  <header class="h-12 bg-[#18181b] border-b border-white/10 px-4 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Terhubung (Encrypted)</span>
      </div>
      <span class="text-xs text-slate-400 hidden sm:inline">|</span>
      <span class="text-xs font-medium text-slate-200 hidden sm:inline">Kaiwa Practice Room 01: 佐藤先生の会話レッスン</span>
    </div>

    <!-- Mode & Meeting Duration -->
    <div class="flex items-center gap-3">
      <div id="meeting-timer" class="text-xs font-mono text-slate-400">00:00</div>
      <a href="/" class="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg transition font-medium">
        <i class="fa-solid fa-phone-slash mr-1"></i> Keluar
      </a>
    </div>
  </header>

  <!-- ── 2. ZOOM MAIN STAGE (GRID TILE: SATO-SENSEI + USER) ── -->
  <main class="flex-1 p-3 grid grid-cols-1 md:grid-cols-2 gap-3 overflow-hidden relative">

    <!-- Tile 1: Sato-san 3D VRM Video Feed -->
    <div id="sato-tile" class="video-tile flex flex-col items-center justify-center relative">
      <!-- 3D Canvas Sato-san -->
      <div id="vrm-canvas-container" class="w-full h-full"></div>

      <!-- Loading Overlay Model -->
      <div id="loading" class="absolute inset-0 bg-[#1e1e24] flex flex-col items-center justify-center text-white z-30 transition-opacity duration-300">
        <div class="w-10 h-10 border-3 border-sky-400 border-t-transparent rounded-full animate-spin mb-3"></div>
        <div class="text-sm font-semibold">Menghubungkan video Sato-san...</div>
        <div id="load-progress" class="text-xs text-slate-400 mt-1">0%</div>
      </div>

      <!-- Speaker Tag (Pojok Kiri Bawah) -->
      <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-lg flex items-center gap-2 z-10 border border-white/10">
        <div id="sato-mic-icon" class="text-xs text-white">
          <i class="fa-solid fa-microphone"></i>
        </div>
        <span class="text-xs font-medium text-white tracking-wide">Sato-san (佐藤さん)</span>
        <span class="text-[10px] bg-sky-500/20 text-sky-400 px-1.5 py-0.5 rounded font-bold">Sensei</span>
      </div>

      <!-- Floating Subtitle Percakapan di dalam Tile Sato-san -->
      <div id="dialog-box" class="hidden absolute bottom-12 left-4 right-4 bg-black/85 backdrop-blur-md px-4 py-2.5 rounded-xl border border-white/15 text-center z-20">
        <div id="dialog-jp" class="text-sm font-bold text-sky-300">こんにちは！声が聞こえますか？今日も楽しく日本語を練習しましょう！</div>
        <div id="dialog-id" class="text-xs text-slate-300 mt-0.5">Halo! Apakah suaraku terdengar? Mari berlatih bahasa Jepang dengan santai hari ini!</div>
      </div>
    </div>

    <!-- Tile 2: User Webcam / Local Feed -->
    <div class="video-tile flex flex-col items-center justify-center relative bg-[#18181b]">
      <video id="user-webcam" class="w-full h-full object-cover -scale-x-100 hidden" autoplay playsinline muted></video>
      
      <!-- Fallback Avatar jika kamera belum/tidak diizinkan -->
      <div id="user-avatar-fallback" class="flex flex-col items-center justify-center gap-3">
        <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center text-3xl font-bold text-white shadow-lg">
          <i class="fa-solid fa-user"></i>
        </div>
        <span class="text-sm font-semibold text-slate-300">Kamera Anda (Belajar Kaiwa)</span>
        <button id="btn-enable-cam" class="text-xs px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200 transition flex items-center gap-1.5">
          <i class="fa-solid fa-camera"></i> Nyalakan Kamera Saya
        </button>
      </div>

      <!-- User Name Tag (Pojok Kiri Bawah) -->
      <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-lg flex items-center gap-2 z-10 border border-white/10">
        <div id="user-mic-icon" class="text-xs text-white">
          <i class="fa-solid fa-microphone"></i>
        </div>
        <span id="user-name-label" class="text-xs font-medium text-white">Anda (Gakusei)</span>
      </div>
    </div>

  </main>

  <!-- ── 3. ZOOM BOTTOM CONTROL BAR ── -->
  <footer class="h-16 bg-[#18181b] border-t border-white/10 px-4 flex items-center justify-between z-20">

    <!-- Kontrol Suara & Video Kiri -->
    <div class="flex items-center gap-2">
      <!-- Tombol Bicara / Voice Input -->
      <button id="btn-toggle-mic" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 text-xs font-medium flex flex-col items-center gap-1 transition min-w-[64px]">
        <i class="fa-solid fa-microphone text-base text-emerald-400"></i>
        <span>Mute</span>
      </button>

      <button id="btn-toggle-cam" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 text-xs font-medium flex flex-col items-center gap-1 transition min-w-[64px]">
        <i class="fa-solid fa-video text-base text-slate-300"></i>
        <span>Video</span>
      </button>
    </div>

    <!-- Kontrol Interaksi Tengah (Topik & Latihan) -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Tombol Pilihan Percakapan / Latihan -->
      <button id="btn-kaiwa-jiko" class="px-3 py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 border border-sky-500/30 text-xs font-medium flex items-center gap-2 transition">
        <i class="fa-regular fa-comment-dots"></i>
        <span class="hidden sm:inline">Topik:</span> Perkenalan (自己紹介)
      </button>

      <button id="btn-kaiwa-aisatsu" class="px-3 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 border border-amber-500/30 text-xs font-medium flex items-center gap-2 transition">
        <i class="fa-regular fa-hand"></i>
        <span class="hidden sm:inline">Topik:</span> Salam Kerja (挨拶)
      </button>

      <button id="btn-kaiwa-shitsumon" class="px-3 py-2 rounded-xl bg-purple-500/20 hover:bg-purple-500/30 text-purple-400 border border-purple-500/30 text-xs font-medium flex items-center gap-2 transition">
        <i class="fa-solid fa-circle-question"></i>
        <span class="hidden sm:inline">Tanya:</span> Tanya Tugas (質問)
      </button>
    </div>

    <!-- Kontrol Kanan (End Call) -->
    <div class="flex items-center gap-2">
      <a href="/" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md">
        <i class="fa-solid fa-phone-slash"></i>
        <span class="hidden sm:inline">Akhiri</span>
      </a>
    </div>

  </footer>

  <!-- ── 4. SCRIPT THREE.JS + VRM ENGINE UNTUK TILE ZOOM SATO-SAN ── -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // ── Setup 3D Scene untuk Kamera Zoom Sato-san ──
    const container = document.getElementById('vrm-canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x27272a); // Background virtual meeting room

    // Sudut pandang webcam Zoom: fokus dada ke kepala
    const camera = new THREE.PerspectiveCamera(26, container.clientWidth / container.clientHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.34, 1.15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // ── Pencahayaan Webcam Studio ──
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff6ed, 2.0);
    keyLight.position.set(0.8, 2.0, 1.5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xe0f2fe, 1.2);
    fillLight.position.set(-1.0, 1.2, 0.8);
    scene.add(fillLight);

    // Virtual Background Kantor Jepang Minimalis
    const bgWall = new THREE.Mesh(
      new THREE.PlaneGeometry(6, 4),
      new THREE.MeshStandardMaterial({ color: 0x3f3f46, roughness: 0.9 })
    );
    bgWall.position.set(0, 1.4, -0.6);
    scene.add(bgWall);

    // Sandaran Kursi Kantor di belakang Sato-san
    const chairBack = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.65, 0.06),
      new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.8 })
    );
    chairBack.position.set(0, 1.28, -0.12);
    scene.add(chairBack);

    // ── State Model Sato-san ──
    let currentVrm = null;
    const clock = new THREE.Clock();

    let blinkTimer = 0;
    let blinkInterval = 3.0;
    let isBlinking = false;
    let blinkProgress = 0;

    let isSpeaking = false;
    let talkTimer = 0;

    // Load File Sato-san.vrm
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      '/models/sato-san.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        if (!vrm) return;

        currentVrm = vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);

        vrm.scene.rotation.y = 0; // Wajah lurus menatap kamera Zoom
        scene.add(vrm.scene);

        // Pose Duduk Alami menghadap webcam
        applyZoomPose(vrm);

        // Hilangkan loading
        const loadingEl = document.getElementById('loading');
        loadingEl.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loadingEl.remove(), 400);

        // Auto salam pertama saat Zoom dimulai
        setTimeout(() => {
          speakSato(
            'こんにちは！佐藤です。Zoomミーティングへようこそ。声はよく聞こえますか？',
            'Halo! Saya Sato. Selamat datang di Zoom meeting ini. Apakah suaraku terdengar jelas?'
          );
        }, 1000);
      },
      (p) => {
        if (p.total > 0) {
          const pct = Math.round((p.loaded / p.total) * 100);
          document.getElementById('load-progress').textContent = `${pct}%`;
        }
      },
      (err) => {
        console.error('Error load vrm:', err);
      }
    );

    // Pose Webcam Zoom (Lengan turun ke bawah rileks di luar frame kamera)
    function applyZoomPose(vrm) {
      if (!vrm || !vrm.humanoid) return;

      const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
      if (leftUpperArm) leftUpperArm.rotation.set(0, 0, -1.35);
      if (rightUpperArm) rightUpperArm.rotation.set(0, 0, 1.35);

      const leftLowerArm = vrm.humanoid.getNormalizedBoneNode('leftLowerArm');
      const rightLowerArm = vrm.humanoid.getNormalizedBoneNode('rightLowerArm');
      if (leftLowerArm) leftLowerArm.rotation.set(0, 0, 0.2);
      if (rightLowerArm) rightLowerArm.rotation.set(0, 0, -0.2);
    }

    // Auto Blink
    function updateBlink(delta) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      blinkTimer += delta;
      if (!isBlinking && blinkTimer >= blinkInterval) {
        isBlinking = true;
        blinkTimer = 0;
        blinkProgress = 0;
        blinkInterval = 2.5 + Math.random() * 3.5;
      }
      if (isBlinking) {
        blinkProgress += delta * 12;
        const w = Math.sin(Math.min(Math.PI, blinkProgress));
        currentVrm.expressionManager.setValue('blink', w);
        if (blinkProgress >= Math.PI) {
          currentVrm.expressionManager.setValue('blink', 0);
          isBlinking = false;
        }
      }
    }

    // Gerak Halus Napas & Gestur Mendengarkan
    function updateNaturalIdle(elapsedTime) {
      if (!currentVrm || !currentVrm.humanoid) return;
      const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
      if (spine) {
        spine.rotation.x = Math.sin(elapsedTime * 1.6) * 0.015;
        spine.rotation.y = Math.cos(elapsedTime * 0.7) * 0.012;
      }
      const head = currentVrm.humanoid.getNormalizedBoneNode('head');
      if (head) {
        // Sedikit mengangguk alami saat percakapan
        head.rotation.x = Math.sin(elapsedTime * 1.3) * 0.018;
      }
    }

    // Lipsync Berbicara
    function updateSpeech(delta) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      if (isSpeaking) {
        talkTimer += delta * 15;
        const aa = Math.max(0, Math.sin(talkTimer) * 0.7);
        currentVrm.expressionManager.setValue('aa', aa);
      } else {
        const cur = currentVrm.expressionManager.getValue('aa');
        if (cur > 0) currentVrm.expressionManager.setValue('aa', Math.max(0, cur - delta * 5));
      }
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (currentVrm) {
        updateBlink(delta);
        updateSpeech(delta);
        applyZoomPose(currentVrm);
        updateNaturalIdle(elapsed);
        currentVrm.update(delta);
      }

      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ── Fungsi Suara Sato-san (Speech Synthesizer + Active Speaker Border) ──
    const dialogBox = document.getElementById('dialog-box');
    const dialogJp = document.getElementById('dialog-jp');
    const dialogId = document.getElementById('dialog-id');
    const satoTile = document.getElementById('sato-tile');

    function speakSato(jpText, idText) {
      dialogJp.textContent = jpText;
      dialogId.textContent = idText;
      dialogBox.classList.remove('hidden');

      // Indikator Active Speaker Zoom (Kotak Hijau di sekeliling video Sato)
      satoTile.classList.add('active-speaker');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(jpText);
        u.lang = 'ja-JP';
        u.rate = 1.0;

        u.onstart = () => {
          isSpeaking = true;
          if (currentVrm && currentVrm.expressionManager) {
            currentVrm.expressionManager.setValue('happy', 0.5);
          }
        };

        u.onend = () => {
          isSpeaking = false;
          satoTile.classList.remove('active-speaker');
          if (currentVrm && currentVrm.expressionManager) {
            currentVrm.expressionManager.setValue('happy', 0);
          }
        };

        u.onerror = () => {
          isSpeaking = false;
          satoTile.classList.remove('active-speaker');
        };

        window.speechSynthesis.speak(u);
      } else {
        isSpeaking = true;
        setTimeout(() => {
          isSpeaking = false;
          satoTile.classList.remove('active-speaker');
        }, 3500);
      }
    }

    // ── Pilihan Topik Pembicaraan Kaiwa ──
    document.getElementById('btn-kaiwa-jiko').addEventListener('click', () => {
      speakSato(
        'はじめまして！私の名前は佐藤です。あなたの自己紹介を聞かせてください。趣味は何ですか？',
        'Senang berkenalan dengan Anda! Nama saya Sato. Boleh ceritakan tentang diri Anda? Apa hobi Anda?'
      );
    });

    document.getElementById('btn-kaiwa-aisatsu').addEventListener('click', () => {
      speakSato(
        'おはようございます！今日も一日お仕事頑張りましょう。何か質問や分からないことはありますか？',
        'Selamat pagi! Mari bersemangat kerja hari ini. Apakah ada pertanyaan atau hal yang belum dipahami?'
      );
    });

    document.getElementById('btn-kaiwa-shitsumon').addEventListener('click', () => {
      speakSato(
        '作業の手順についてですね。まずは安全第一で確認しましょう。どの部分が気になりますか？',
        'Mengenai prosedur kerja ya. Yang terpenting utamakan keselamatan kerja terlebih dahulu. Bagian mana yang ingin Anda tanyakan?'
      );
    });

    // ── Webcam Pengguna (User Local Video) ──
    const userWebcam = document.getElementById('user-webcam');
    const avatarFallback = document.getElementById('user-avatar-fallback');
    const btnEnableCam = document.getElementById('btn-enable-cam');
    const btnToggleCam = document.getElementById('btn-toggle-cam');

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        userWebcam.srcObject = stream;
        userWebcam.classList.remove('hidden');
        avatarFallback.classList.add('hidden');
        btnToggleCam.querySelector('i').className = 'fa-solid fa-video text-base text-emerald-400';
      } catch (e) {
        console.warn('Webcam tidak dapat diakses / ditolak:', e);
      }
    }

    btnEnableCam.addEventListener('click', startWebcam);
    btnToggleCam.addEventListener('click', () => {
      if (userWebcam.srcObject) {
        const tracks = userWebcam.srcObject.getTracks();
        tracks.forEach((t) => t.stop());
        userWebcam.srcObject = null;
        userWebcam.classList.add('hidden');
        avatarFallback.classList.remove('hidden');
        btnToggleCam.querySelector('i').className = 'fa-solid fa-video-slash text-base text-rose-400';
      } else {
        startWebcam();
      }
    });

    // Toggle Mic Button
    const btnToggleMic = document.getElementById('btn-toggle-mic');
    let isMuted = false;
    btnToggleMic.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        btnToggleMic.querySelector('i').className = 'fa-solid fa-microphone-slash text-base text-rose-400';
        btnToggleMic.querySelector('span').textContent = 'Unmute';
      } else {
        btnToggleMic.querySelector('i').className = 'fa-solid fa-microphone text-base text-emerald-400';
        btnToggleMic.querySelector('span').textContent = 'Mute';
      }
    });

    // Meeting Duration Timer
    let sec = 0;
    setInterval(() => {
      sec++;
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      document.getElementById('meeting-timer').textContent = `${m}:${s}`;
    }, 1000);
  </script>
</body>
</html>
