<!DOCTYPE html>
<html lang="id">

<head>
  <script src="/assets/js/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Tebak Kanji & Kotoba — Game SinauJepang</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-fuji-overlay {
      background: linear-gradient(135deg, rgba(240, 249, 255, .95) 0%, rgba(224, 242, 254, .92) 100%),
        url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .opt-card {
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .opt-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="bg-fuji-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-fuji-200">
  <!-- Header Bersama -->
  <script src="/assets/js/indexeddb.js"></script>
  <script src="/assets/js/site-layout.js"></script>

  <main class="flex-grow bg-fuji-overlay px-4 py-8 md:py-12 flex flex-col items-center justify-center">
    <div class="max-w-2xl w-full">

      <!-- Header & Mode Switcher -->
      <div class="text-center mb-6">
        <div
          class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold mb-3 border border-amber-200 shadow-sm">
          <i class="fa-solid fa-gamepad text-amber-600"></i>
          <span>Asah Otak • Kuis Cepat 4 Pilihan</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">
          Mini Game <span id="gameTitleHighlight" class="text-rose-600">Tebak Kanji</span>
        </h1>
        <p class="text-slate-600 text-xs sm:text-sm">
          Pilih arti atau bacaan yang paling tepat dalam waktu singkat.
        </p>

        <!-- Switch Game Mode: Kanji vs Kotoba -->
        <div class="inline-flex bg-white/90 p-1.5 rounded-2xl border border-slate-200 shadow-sm mt-4 backdrop-blur-md">
          <button id="tabKanji" onclick="switchGameMode('kanji')"
            class="px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-rose-600 text-white shadow-md shadow-rose-600/20 flex items-center gap-2">
            <i class="fa-solid fa-language"></i>
            <span>Tebak Kanji</span>
          </button>
          <button id="tabKotoba" onclick="switchGameMode('kotoba')"
            class="px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-slate-600 hover:text-emerald-700 flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i>
            <span>Tebak Kotoba</span>
          </button>
        </div>
      </div>

      <!-- Filter Level Khusus Mode Kanji: 1 Radikal, 2 Kanji Tunggal, 3 Kanji Kotoba -->
      <div id="levelFilterBox"
        class="bg-white/80 backdrop-blur-md rounded-2xl p-3 border border-slate-200 mb-6 flex flex-wrap items-center justify-center gap-2 text-xs font-bold text-slate-600 shadow-sm">
        <span class="text-slate-400 mr-1"><i class="fa-solid fa-layer-group"></i> Level Mode:</span>
        <button onclick="setKanjiLevel('radikal')" id="lvl-radikal"
          class="lvl-btn px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all">Level 1: Radikal (部首)</button>
        <button onclick="setKanjiLevel('tunggal')" id="lvl-tunggal"
          class="lvl-btn px-3.5 py-1.5 rounded-xl bg-slate-800 text-white transition-all">Level 2: Kanji Tunggal (単漢字)</button>
        <button onclick="setKanjiLevel('kotoba')" id="lvl-kotoba"
          class="lvl-btn px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all">Level 3: Kanji Kotoba (熟語)</button>
      </div>

      <!-- Main Game Card -->
      <div
        class="bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-slate-200/90 shadow-2xl relative overflow-hidden">

        <!-- Score Bar & Streak -->
        <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100 text-xs sm:text-sm">
          <div class="flex items-center gap-3">
            <span
              class="bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
              <i class="fa-solid fa-circle-check text-emerald-500"></i>
              <span>Skor: <b id="scoreVal" class="text-emerald-800 text-base">0</b></span>
            </span>
            <span
              class="bg-amber-50 text-amber-700 border border-amber-200 font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
              <i class="fa-solid fa-fire text-amber-500"></i>
              <span>Streak: <b id="streakVal" class="text-amber-800">0</b></span>
            </span>
            <span class="bg-sky-50 text-sky-700 border border-sky-200 font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
              <i class="fa-solid fa-list-ol text-sky-500"></i>
              <span>Progres: <b id="progressVal" class="text-sky-800">0 / 0</b></span>
            </span>
          </div>
          <button onclick="resetGame()"
            class="text-slate-400 hover:text-slate-600 font-semibold text-xs flex items-center gap-1 transition-all">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Reset</span>
          </button>
        </div>

        <!-- Question Box -->
        <div class="text-center py-4 mb-6">
          <span id="questionCategory"
            class="text-[11px] font-bold uppercase tracking-wider text-slate-400 bg-slate-100 px-3 py-1 rounded-full">KANJI</span>

          <!-- Karakter Utama Soal (Kanji / Kosakata) -->
          <div id="targetDisplay"
            class="my-4 font-black tracking-tight text-slate-800 select-none transition-all text-6xl sm:text-7xl font-sans min-h-[80px] flex items-center justify-center">
            ...
          </div>

          <!-- Sub petunjuk (bacaan furigana / romaji jika ada) -->
          <div id="targetSub" class="text-sm font-semibold text-slate-500 min-h-[22px]">
            Apa arti dari karakter di atas?
          </div>
        </div>

        <!-- 4 Options Grid -->
        <div id="optionsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
          <!-- Di-render dinamis 4 kartu -->
        </div>

        <!-- Feedback & Next Action Card -->
        <div id="feedbackBar"
          class="hidden rounded-3xl p-5 sm:p-6 transition-all shadow-sm">
          
          <!-- Baris Utama: Status + Tombol Lanjut -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-black/5">
            <div class="flex items-center gap-3.5">
              <div id="feedbackIcon" class="w-11 h-11 rounded-2xl flex items-center justify-center text-white text-xl shrink-0 shadow-sm">
              </div>
              <div>
                <h4 id="feedbackTitle" class="font-black text-base sm:text-lg tracking-tight"></h4>
                <p id="feedbackDetail" class="text-xs sm:text-sm text-slate-600 font-semibold mt-0.5"></p>
              </div>
            </div>
            <button id="nextBtn" onclick="nextQuestion()"
              class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-bold px-6 py-3 rounded-2xl text-xs sm:text-sm transition-all shadow-md flex items-center justify-center gap-2 shrink-0">
              <span>Lanjut Soal Berikutnya</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </div>

          <!-- Kartu Penjelasan Asal-Usul, Piktograf & Filosofi -->
          <div id="feedbackPicfilo" class="hidden pt-4">
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    // State Aplikasi Game (Non-Repeating Deck System)
    let currentMode = 'kanji'; // 'kanji' | 'kotoba'
    let kanjiLevel = 'tunggal'; // 'radikal' (Level 1) | 'tunggal' (Level 2) | 'kotoba' (Level 3)
    let kanjiData = [];
    let kotobaData = [];
    let radicalData = [];
    let kanjiKotobaData = [];
    let picfiloMap = {};
    
    // Antrean Soal Unik (Deck yang diacak agar tidak ada yang terulang)
    let activeQueue = [];
    let totalInQueue = 0;
    let completedCount = 0;

    let score = 0;
    let streak = 0;
    let currentQ = null;
    let isAnswered = false;

    // Algoritma Fisher-Yates Shuffle murni
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Load Datasets & Extract Sub-levels
    async function initDatasets() {
      try {
        const [resKanji, resKotoba, resPicfilo] = await Promise.all([
          fetch('/kanji-jft-a2.json').then(r => r.json()),
          fetch('/kosakata.json').then(r => r.json()),
          fetch('/assets/data/kanji-picfilo.json').then(r => r.json()).catch(() => [])
        ]);
        kanjiData = resKanji || [];
        kotobaData = (resKotoba && resKotoba.data) ? resKotoba.data : [];
        if (Array.isArray(resPicfilo)) {
          resPicfilo.forEach(item => {
            if (item && item.kanji) picfiloMap[item.kanji] = item;
          });
        }

        // 1. Ekstraksi Level 1: Radikal Unik (121 radikal)
        const radMap = new Map();
        kanjiData.forEach(item => {
          if (item.radical && !radMap.has(item.radical)) {
            const kana = item.radMeta?.kana || (item.namaRadikal ? item.namaRadikal.split(' ')[0] : '') || '';
            const arti = item.radMeta?.arti || item.artiRadikal || (item.radName ? item.radName.replace(/^[^(]+\(([^)]+)\).*/, '$1') : '') || item.radName || '';
            radMap.set(item.radical, {
              radical: item.radical,
              kana: kana,
              arti: arti,
              nama: item.radName || item.namaRadikal,
              grup: item.grupRadikal || 'Radikal Kanji'
            });
          }
        });
        radicalData = Array.from(radMap.values());

        // 2. Ekstraksi Level 3: Kanji Kotoba / Jukugo (554 kosakata kanji gabungan)
        const vList = [];
        kanjiData.forEach(item => {
          if (Array.isArray(item.vocab)) {
            item.vocab.forEach(v => {
              const w = v.word || v.kanji || v.t || '';
              const m = v.arti || v.m || '';
              if (w && m) {
                vList.push({
                  parentKanji: item.kanji,
                  word: w,
                  kana: v.kana || v.r || '',
                  arti: m
                });
              }
            });
          }
        });
        kanjiKotobaData = vList;

        rebuildQueue();
        nextQuestion();
      } catch (e) {
        console.error('Gagal memuat dataset game:', e);
      }
    }

    // Membangun Antrean Soal Baru Tanpa Duplikasi Sesuai Level
    function rebuildQueue() {
      if (currentMode === 'kanji') {
        if (kanjiLevel === 'radikal') {
          activeQueue = shuffleArray(radicalData);
        } else if (kanjiLevel === 'kotoba') {
          activeQueue = shuffleArray(kanjiKotobaData);
        } else {
          // Default: Level 2 Kanji Tunggal (336 kanji)
          activeQueue = shuffleArray(kanjiData);
        }
      } else {
        // Mode Tebak Kotoba Umum
        activeQueue = shuffleArray(kotobaData);
      }
      totalInQueue = activeQueue.length;
      completedCount = 0;
      updateProgressUI();
    }

    function updateProgressUI() {
      const pEl = document.getElementById('progressVal');
      if (pEl) {
        pEl.textContent = `${completedCount} / ${totalInQueue}`;
      }
    }

    // Switch Mode Game
    window.switchGameMode = function (mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      const tabK = document.getElementById('tabKanji');
      const tabW = document.getElementById('tabKotoba');
      const lvlBox = document.getElementById('levelFilterBox');
      const hl = document.getElementById('gameTitleHighlight');

      if (mode === 'kanji') {
        tabK.className = 'px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-rose-600 text-white shadow-md shadow-rose-600/20 flex items-center gap-2';
        tabW.className = 'px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-slate-600 hover:text-emerald-700 flex items-center gap-2';
        lvlBox.classList.remove('hidden');
        hl.textContent = 'Tebak Kanji';
        hl.className = 'text-rose-600';
      } else {
        tabW.className = 'px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-emerald-600 text-white shadow-md shadow-emerald-600/20 flex items-center gap-2';
        tabK.className = 'px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-slate-600 hover:text-rose-700 flex items-center gap-2';
        lvlBox.classList.add('hidden');
        hl.textContent = 'Tebak Kotoba';
        hl.className = 'text-emerald-600';
      }
      rebuildQueue();
      nextQuestion();
    };

    // Filter Level Mode Kanji
    window.setKanjiLevel = function (lvl) {
      kanjiLevel = lvl;
      document.querySelectorAll('.lvl-btn').forEach(b => {
        b.className = 'lvl-btn px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all';
      });
      const activeBtn = document.getElementById('lvl-' + lvl);
      if (activeBtn) {
        activeBtn.className = 'lvl-btn px-3 py-1.5 rounded-xl bg-slate-800 text-white transition-all';
      }
      rebuildQueue();
      nextQuestion();
    };

    // Ambil Soal Berikutnya (Pop dari Antrean Unik)
    window.nextQuestion = function () {
      isAnswered = false;
      document.getElementById('feedbackBar').classList.add('hidden');

      // Jika antrean habis, seluruh soal di mode/level ini telah tuntas!
      if (!activeQueue || activeQueue.length === 0) {
        showRoundCompleted();
        return;
      }

      // Ambil 1 item dari depan antrean (dijamin belum pernah keluar)
      const target = activeQueue.pop();
      completedCount++;
      updateProgressUI();

      if (currentMode === 'kanji') {
        renderKanjiQuestion(target);
      } else {
        renderKotobaQuestion(target);
      }
    };

    function showRoundCompleted() {
      const grid = document.getElementById('optionsGrid');
      document.getElementById('targetDisplay').innerHTML = '🎉';
      document.getElementById('questionCategory').textContent = 'RONDE SELESAI';
      document.getElementById('targetSub').innerHTML = `<b class="text-emerald-600 font-bold text-base">Hebat! Anda telah menyelesaikan seluruh ${totalInQueue} soal tanpa ada yang terulang!</b>`;
      grid.innerHTML = `
        <div class="col-span-1 sm:col-span-2 text-center p-6 bg-emerald-50 rounded-2xl border border-emerald-200">
          <p class="text-sm text-slate-700 mb-4 font-semibold">Semua soal pada level ini sudah berhasil Anda taklukkan.</p>
          <button onclick="rebuildQueue(); nextQuestion();" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-full text-sm shadow-md transition-all">
            Ulangi Ronde Baru (Diacak Lagi)
          </button>
        </div>
      `;
    }

    function getKanjiReading(k) {
      const kun = k.kun && k.kun !== '-' ? k.kun : '';
      const on = k.on && k.on !== '-' ? k.on : '';
      if (kun && on) return `${kun} / ${on}`;
      return kun || on || '';
    }

    function renderKanjiQuestion(target) {
      const distractors = [];

      // ==========================================
      // LEVEL 1: RADIKAL KANJI (部首)
      // ==========================================
      if (kanjiLevel === 'radikal') {
        const targetOptionText = `${target.kana ? target.kana + ' — ' : ''}${target.arti}`;
        const used = new Set([target.radical, targetOptionText]);
        const randomCandidates = shuffleArray(radicalData);
        for (let r of randomCandidates) {
          const rText = `${r.kana ? r.kana + ' — ' : ''}${r.arti}`;
          if (r && r.arti && !used.has(r.radical) && !used.has(rText)) {
            used.add(r.radical);
            used.add(rText);
            distractors.push({ ...r, optionText: rText });
            if (distractors.length >= 3) break;
          }
        }
        const options = [
          { text: targetOptionText, isCorrect: true, item: target },
          ...distractors.map(d => ({ text: d.optionText, isCorrect: false, item: d }))
        ].sort(() => Math.random() - 0.5);

        const info = picfiloMap[target.radical];
        currentQ = {
          target: {
            kanji: target.radical,
            detail: targetOptionText,
            pic: info ? info.pic : '',
            filo: info ? info.filo : ''
          },
          options
        };
        document.getElementById('questionCategory').textContent = `LEVEL 1: RADIKAL • ${target.grup || 'Komponen Kanji'}`;
        document.getElementById('targetDisplay').textContent = target.radical;
        document.getElementById('targetSub').innerHTML = '<span class="text-slate-400 font-medium">Pilihlah bacaan kana dan arti yang tepat</span>';
        renderOptionsGrid(options);
        return;
      }

      // ==========================================
      // LEVEL 3: KANJI KOTOBA / JUKUGO (熟語)
      // ==========================================
      if (kanjiLevel === 'kotoba') {
        const targetOptionText = `${target.kana} — ${target.arti}`;
        const used = new Set([target.word, targetOptionText]);
        const randomCandidates = shuffleArray(kanjiKotobaData);
        for (let v of randomCandidates) {
          const vText = `${v.kana} — ${v.arti}`;
          if (v && v.arti && !used.has(v.word) && !used.has(vText)) {
            used.add(v.word);
            used.add(vText);
            distractors.push({ ...v, optionText: vText });
            if (distractors.length >= 3) break;
          }
        }
        const options = [
          { text: targetOptionText, isCorrect: true, item: target },
          ...distractors.map(d => ({ text: d.optionText, isCorrect: false, item: d }))
        ].sort(() => Math.random() - 0.5);

        currentQ = { target: { kanji: target.word, detail: `${target.word} (${target.kana}) = ${target.arti} (Induk: ${target.parentKanji})` }, options };
        document.getElementById('questionCategory').textContent = `LEVEL 3: KANJI KOTOBA • Induk: 【${target.parentKanji}】`;
        document.getElementById('targetDisplay').textContent = target.word;
        document.getElementById('targetSub').innerHTML = '<span class="text-slate-400 font-medium">Pilihlah bacaan kana dan arti yang tepat</span>';
        renderOptionsGrid(options);
        return;
      }

      // ==========================================
      // LEVEL 2: KANJI TUNGGAL (単漢字 - 336 Kanji)
      // ==========================================
      const targetReading = getKanjiReading(target);
      const targetOptionText = `${targetReading} — ${target.arti}`;
      const used = new Set([target.kanji, targetOptionText]);
      const randomCandidates = shuffleArray(kanjiData);
      for (let k of randomCandidates) {
        const kReading = getKanjiReading(k);
        const kText = `${kReading} — ${k.arti}`;
        if (k && k.arti && !used.has(k.kanji) && !used.has(kText)) {
          used.add(k.kanji);
          used.add(kText);
          distractors.push({ ...k, optionText: kText });
          if (distractors.length >= 3) break;
        }
      }

      const options = [
        { text: targetOptionText, isCorrect: true, item: target },
        ...distractors.map(d => ({ text: d.optionText, isCorrect: false, item: d }))
      ].sort(() => Math.random() - 0.5);

      const info = picfiloMap[target.kanji];
      currentQ = {
        target: {
          ...target,
          detail: `${target.kanji} [${targetReading}] = ${target.arti}`,
          pic: info ? info.pic : '',
          filo: info ? info.filo : ''
        },
        options
      };
      document.getElementById('questionCategory').textContent = `LEVEL 2: KANJI TUNGGAL • ${target.stroke || 0} Coretan • Radikal: ${target.radical || '-'}`;
      document.getElementById('targetDisplay').textContent = target.kanji;
      document.getElementById('targetSub').innerHTML = '<span class="text-slate-400 font-medium">Pilihlah bacaan kana dan arti yang tepat</span>';
      renderOptionsGrid(options);
    }

    function renderKotobaQuestion(target) {
      const distractors = [];
      const used = new Set([target.arti]);

      const randomCandidates = shuffleArray(kotobaData);
      for (let w of randomCandidates) {
        if (w && w.arti && !used.has(w.arti)) {
          used.add(w.arti);
          distractors.push(w);
          if (distractors.length >= 3) break;
        }
      }

      const options = [
        { text: target.arti, isCorrect: true, item: target },
        ...distractors.map(d => ({ text: d.arti, isCorrect: false, item: d }))
      ].sort(() => Math.random() - 0.5);

      currentQ = { target, options };

      document.getElementById('questionCategory').textContent = 'KOTOBA A2';
      document.getElementById('targetDisplay').textContent = target.kanji || target.kana;
      document.getElementById('targetSub').innerHTML = target.kanji !== target.kana
        ? `Kana: <b class="text-emerald-700">${target.kana}</b> • Romaji: <i class="text-slate-500">${target.rom || ''}</i>`
        : `Romaji: <i class="text-slate-500">${target.rom || ''}</i>`;

      renderOptionsGrid(options);
    }

    function renderOptionsGrid(options) {
      const grid = document.getElementById('optionsGrid');
      const letters = ['A', 'B', 'C', 'D'];
      grid.innerHTML = '';

      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-card bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-2xl p-4 text-left font-bold text-slate-800 flex items-center gap-3 transition-all';
        btn.innerHTML = `
          <span class="w-8 h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xs font-black text-slate-600 shadow-sm shrink-0">
            ${letters[idx]}
          </span>
          <span class="text-xs sm:text-sm flex-1 leading-snug">${opt.text}</span>
        `;
        btn.onclick = () => selectAnswer(opt, btn, options);
        grid.appendChild(btn);
      });
    }

    function selectAnswer(opt, selectedBtn, allOptions) {
      if (isAnswered) return;
      isAnswered = true;

      const fbBar = document.getElementById('feedbackBar');
      const fbIcon = document.getElementById('feedbackIcon');
      const fbTitle = document.getElementById('feedbackTitle');
      const fbDetail = document.getElementById('feedbackDetail');
      const allButtons = document.querySelectorAll('.opt-card');

      if (opt.isCorrect) {
        score += 10;
        streak += 1;
        selectedBtn.classList.remove('bg-slate-50', 'border-slate-200');
        selectedBtn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'shadow-md');

        fbBar.className = 'rounded-3xl p-5 sm:p-6 transition-all shadow-sm bg-emerald-50/90 border border-emerald-200';
        fbIcon.className = 'w-11 h-11 rounded-2xl flex items-center justify-center text-white text-xl bg-emerald-500 shadow-sm shrink-0';
        fbIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
        fbTitle.className = 'font-black text-base sm:text-lg text-emerald-900 tracking-tight';
        fbTitle.textContent = 'Luar Biasa, Jawaban Benar! (+10 Poin)';
        fbDetail.innerHTML = `Karakter: <b class="text-slate-800">${currentQ.target.kanji || currentQ.target.kana}</b> &rarr; <span class="text-emerald-800 font-bold">${opt.text}</span>`;
      } else {
        streak = 0;
        selectedBtn.classList.remove('bg-slate-50', 'border-slate-200');
        selectedBtn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900', 'ring-2', 'ring-rose-300');

        // Tandai jawaban yang benar
        allOptions.forEach((o, i) => {
          if (o.isCorrect && allButtons[i]) {
            allButtons[i].classList.remove('bg-slate-50', 'border-slate-200');
            allButtons[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-950', 'font-extrabold', 'ring-2', 'ring-emerald-400/50');
          }
        });

        fbBar.className = 'rounded-3xl p-5 sm:p-6 transition-all shadow-sm bg-rose-50/90 border border-rose-200';
        fbIcon.className = 'w-11 h-11 rounded-2xl flex items-center justify-center text-white text-xl bg-rose-500 shadow-sm shrink-0';
        fbIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        fbTitle.className = 'font-black text-base sm:text-lg text-rose-900 tracking-tight';
        fbTitle.textContent = 'Jawaban Kurang Tepat';
        const correctOpt = allOptions.find(o => o.isCorrect);
        const correctText = currentQ.target.detail || (correctOpt ? correctOpt.text : '');
        fbDetail.innerHTML = `Kunci yang benar: <b class="text-slate-900 bg-white/70 px-2.5 py-0.5 rounded-lg border border-rose-200 inline-block mt-0.5">${correctText}</b>`;
      }

      // Render Penjelasan Piktograf & Filosofi (Level Radikal & Kanji Tunggal)
      const fbPicfilo = document.getElementById('feedbackPicfilo');
      if (fbPicfilo) {
        const hasPicOrFilo = currentQ && currentQ.target && (currentQ.target.pic || currentQ.target.filo);
        if (hasPicOrFilo) {
          const targetChar = currentQ.target.kanji || '';
          let rowsHtml = '';
          if (currentQ.target.pic) {
            rowsHtml += `
              <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3 bg-white/95 rounded-xl p-3 border border-slate-200/80">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-50 text-amber-900 font-extrabold text-[11px] shrink-0 border border-amber-200 w-fit">
                  <i class="fa-solid fa-image text-amber-600"></i> Piktograf
                </span>
                <span class="text-slate-700 text-xs sm:text-sm leading-relaxed">${currentQ.target.pic}</span>
              </div>
            `;
          }
          if (currentQ.target.filo) {
            rowsHtml += `
              <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3 bg-white/95 rounded-xl p-3 border border-slate-200/80">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-50 text-sky-900 font-extrabold text-[11px] shrink-0 border border-sky-200 w-fit">
                  <i class="fa-solid fa-lightbulb text-sky-600"></i> Filosofi
                </span>
                <span class="text-slate-700 text-xs sm:text-sm leading-relaxed">${currentQ.target.filo}</span>
              </div>
            `;
          }
          fbPicfilo.innerHTML = `
            <div class="space-y-2.5">
              <div class="text-[11px] font-black tracking-wider uppercase text-slate-500 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Asal-Usul & Makna Karakter 【${targetChar}】
              </div>
              <div class="grid grid-cols-1 gap-2">
                ${rowsHtml}
              </div>
            </div>
          `;
          fbPicfilo.classList.remove('hidden');
        } else {
          fbPicfilo.innerHTML = '';
          fbPicfilo.classList.add('hidden');
        }
      }

      document.getElementById('scoreVal').textContent = score;
      document.getElementById('streakVal').textContent = streak;
      fbBar.classList.remove('hidden');
    }

    window.resetGame = function () {
      score = 0;
      streak = 0;
      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('streakVal').textContent = '0';
      rebuildQueue();
      nextQuestion();
    };

    // Mulai saat halaman dibuka
    document.addEventListener('DOMContentLoaded', initDatasets);
  </script>
</body>

</html>
