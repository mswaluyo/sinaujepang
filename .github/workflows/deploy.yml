name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: npm ci
        run: npm ci
      - name: Run ESLint lint
        run: npm run lint
      - name: Update TODO from lint
        run: powershell -ExecutionPolicy Bypass -File ${{ github.workspace }}/scripts/update_todo_from_lint.ps1

      - name: npm run build:css
        run: npm run build:css

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --only hosting:sinaujepang --project sinau-jepang --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          CI: true