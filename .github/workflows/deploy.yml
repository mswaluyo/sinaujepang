name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FIREBASE_PROJECT: sinaujepang

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.28.1

      - name: Deploy to Firebase Hosting
        run: |
          # Deploy cuma site 'sinaujepang' (target utama, project sinaujepang).
          # firebase.json punya 2 entry: 'utama' (sinaujepang) + 'sinau-jepang'.
          # Script ini cetak ke site milik project sinaujepang saja.
          firebase deploy --only hosting:sinaujepang --project ${{ env.FIREBASE_PROJECT }} --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          CI: true