name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FIREBASE_PROJECT: sinau-jepang

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.28.1

      - name: Deploy to Firebase Hosting
        run: |
          # Deploy ke project sinau-jepang (site: sinaujepang, target: sinaujepang)
          firebase deploy --only hosting:sinaujepang --project ${{ env.FIREBASE_PROJECT }} --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          CI: true