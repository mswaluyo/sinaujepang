name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FIREBASE_PROJECT: sinau-jepang

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.28.1

      - name: Deploy to Firebase Hosting
        run: |
          # Deploy cuma site yang dimiliki project CI (sinau-jepang).
          # Entry hosting 'utama' di firebase.json merujuk project 'sinaujepang',
          # jadi kalau CI credential nggak punya akses project itu, deploy gagal.
          # Skrip ini risk-nya jadi cuma ke site milik project sinau-jepang.
          firebase deploy --only hosting:sinau-jepang --project ${{ env.FIREBASE_PROJECT }} --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          CI: true